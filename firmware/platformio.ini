[platformio]
default_envs = native

[env:native]
platform = native
test_framework = custom
build_flags = -std=c++17 -Wall

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -std=c++17
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
